name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Crypto-Address-Generator-BTC.sln
      - name: Build
        run: dotnet build Crypto-Address-Generator-BTC.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Crypto-Address-Generator-BTC.sln --no-build --configuration Release
      - name: Publish
        run: dotnet publish src/Crypto-Address-Generator-BTC/Crypto-Address-Generator-BTC.csproj --configuration Release --no-build --output ./artifacts
